[package]
name = "ipc-contract-system"
version = "2.1.1"
edition = "2021"
authors = ["IPC Contract System Team"]
description = "High-security IPC with Canonical Binary Contracts v2.1 - Security/Protocol Correctness"

[lib]
name = "ipc_contract_system"
path = "src/lib.rs"

[[bin]]
name = "contractc"
path = "src/bin/contractc.rs"
required-features = ["clap"]

[[bin]]
name = "ipc_engine_v2"
path = "src/bin/ipc_engine_v2.rs"

[features]
default = ["runtime"]
runtime = []
clap = ["dep:clap"]

[dependencies]
# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Binary format
bytes = "1.5"
byteorder = "1.5"

# Cryptography
aes-gcm = "0.10"
chacha20poly1305 = "0.10"
blake3 = "1.5"
sha2 = "0.10"
hmac = "0.12"
ed25519-dalek = { version = "2.0", features = ["rand_core"] }
rand = "0.8"
x25519-dalek = { version = "2.0", features = ["static_secrets"] }

# Async runtime
tokio = { version = "1.35", features = ["full"] }

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# CLI
clap = { version = "4.4", features = ["derive"], optional = true }

# Utilities
parking_lot = "0.12"
dashmap = "5.5"
once_cell = "1.19"

[dev-dependencies]
proptest = "1.4"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
